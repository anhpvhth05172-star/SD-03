spring.application.name=DATN
server.port=8080
spring.config.import=optional:file:./.env[.properties],optional:file:./BE/.env[.properties]

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PolyShoesDB;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

app.auth.session-inactivity-ms=28800000
app.auth.session-remember-ms=2592000000
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.nhan-vien-expiration-ms=900000
# Khoa Gemini cho chat AI tren BE (khong commit gia tri that)
gemini.api.key=${GEMINI_API_KEY:}

spring.jackson.deserialization.accept-float-as-int=false

# Upload & Request size limits
server.tomcat.max-http-form-post-size=30MB
server.tomcat.max-swallow-size=30MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB

spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh

app.ghn.api-url=${GHN_API_URL:https://dev-online-gateway.ghn.vn}
app.ghn.token=${GHN_TOKEN:}
app.ghn.shop-id=${GHN_SHOP_ID:}
app.ghn.package-length-cm=${GHN_PACKAGE_LENGTH_CM:30}
app.ghn.package-width-cm=${GHN_PACKAGE_WIDTH_CM:20}
app.ghn.package-height-cm=${GHN_PACKAGE_HEIGHT_CM:15}
app.ghn.default-item-weight-g=${GHN_DEFAULT_ITEM_WEIGHT_G:500}
app.ghn.max-weight-g=${GHN_MAX_WEIGHT_G:30000}
app.ghn.insurance-max-vnd=${GHN_INSURANCE_MAX_VND:5000000}
app.ghn.from-district-id=${GHN_FROM_DISTRICT_ID:1486}
app.ghn.from-ward-code=${GHN_FROM_WARD_CODE:910012}
app.ghn.timeout-ms=${GHN_TIMEOUT_MS:10000}
app.dia-chi.open-api-url=${DIA_CHI_OPEN_API_URL:https://provinces.open-api.vn}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

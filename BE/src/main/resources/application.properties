spring.application.name=DATN

# ===== SQL Server =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PolyShoesDB;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456a@
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# ===== JWT =====
app.jwt.secret=TGIqllBw2vKZsRHOmSm0a39M4Y7a0kipFX/aZASwkh4=
# Access Token: 15 phut
app.jwt.expiration-ms=900000
# Phien dang nhap: het han sau 30 phut khong hoat dong (ke tu lan hoat dong hop le cuoi)
app.auth.session-inactivity-ms=1800000

# ===== Jackson: khong cho float/decimal lam tron ngam vao field Integer (vi du soLuong 1.5 -> 400) =====
spring.jackson.deserialization.accept-float-as-int=false

# ===== HikariCP Connection Pool =====
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===== Mui gio (thai) =====
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_USERNAME}
app.mail.from-name=Tên c?a hàng c?a b?n
